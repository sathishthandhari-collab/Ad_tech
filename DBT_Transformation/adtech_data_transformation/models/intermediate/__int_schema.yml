version: 2

models:
  - name: int_pacing_and_billing__model
    description: "Monthly pacing and billing metrics at campaign_id + placement_name grain."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, campaign_id, placement_name]
    columns:
      - name: month
        description: "Month bucket for pacing."
        tests:
          - not_null
      - name: campaign_id
        description: "CM360 campaign id."
        tests:
          - not_null
      - name: placement_name
        description: "Placement key."
        tests:
          - not_null
      - name: planned_impressions
        description: "Planned impressions from Prisma or deterministic fallback."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: contracted_rate
        description: "Rate used for billing calculations."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: total_impressions_cm360
        description: "Delivered impressions from CM360."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
  - name: int_business_analytics__metrics_model
    description: "Daily analytics join at placement-date grain; CM360 performance + IAS quality + site demographics."
    columns:
      - name: date
        description: "Event date at daily grain."
        tests:
          - not_null
      - name: campaign_id
        description: "CM360 campaign identifier."
        tests:
          - not_null
      - name: placement_name
        description: "Placement name as key."
        tests:
          - not_null
      - name: impressions
        description: "Delivered impressions from CM360."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ias_viewable_ads
        description: "Viewable ads from IAS."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, campaign_id, placement_name]

