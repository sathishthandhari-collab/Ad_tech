version: 2

models:
  - name: mart_daily_report_unified
    description: "Daily unified performance report with rolling 3-month averages for placement-level metrics"
    config:
      contract:
        enforced: true
    columns:
      - name: day
        data_type: date
        description: "Report date"
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: month
        data_type: date
        description: "Report month"
        constraints:
          - type: not_null
          
      - name: placement_name
        data_type: string
        description: "Placement identifier"
        constraints:
          - type: not_null
        tests:
          - not_null
      - name: campaign_group
        data_type: string
        description: "Campaign group associated with the placement"
          
      - name: campaign_id
        data_type: string
        description: "Campaign identifier"
        tests:
          - not_null
          
      - name: campaign_name
        data_type: string
        description: "Campaign name"
        
      - name: site_name
        data_type: string
        description: "Site or publisher name"
        
      - name: creative_concept
        data_type: string
        description: "Creative concept identifier"
        
      - name: creative_type
        data_type: string
        description: "Type of creative (video, display, etc.)"
        tests:
          - accepted_values:
              arguments:
                values: ['video', 'display', 'native', 'audio']
        
      - name: state
        data_type: string
        description: "Geographic state"
        
      - name: region
        data_type: string
        description: "Geographic region"
        
      - name: sex
        data_type: string
        description: "Target gender demographic"
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Unknown', 'All']
        
      - name: device_type
        data_type: string
        description: "Device type (mobile, desktop, tablet)"
        tests:
          - accepted_values:
              arguments:
                values: ['mobile', 'desktop', 'tablet', 'ctv']
        
      - name: impressions
        data_type: number
        description: "Total impressions delivered"
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: clicks
        data_type: number
        description: "Total clicks"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: ias_impressions
        data_type: number
        description: "IAS verified impressions"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
        
      - name: ias_video_completions
        data_type: number
        description: "IAS verified video completions"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: ias_brand_safety_ads
        data_type: number
        description: "Brand safety ads detected by IAS"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
      - name: ias_out_of_geo_ads
        data_type: number
        description: "Out-of-geo ads detected by IAS"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ias_page_views
        data_type: number
        description: "IAS tracked page views"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: ias_viewable_ads
        data_type: number
        description: "IAS viewable ads"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: contracted_rate
        data_type: float
        description: "Contracted CPM rate"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
        
      - name: media_cost
        data_type: float
        description: "Calculated media cost (impressions * contracted_rate / 1000)"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: video_completion_rate
        data_type: float
        description: "Video completion rate (ias_video_completions / impressions)"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
        
      - name: cpcv
        data_type: float
        description: "Cost per completed view"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: ctr
        data_type: float
        description: "Click-through rate"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
      - name: cpc
        data_type: float
        description: "Cost per click"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: region_impression_share
        data_type: float
        description: "Share of impressions by region"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
        
      - name: ctr_3month_avg
        data_type: float
        description: "90-day rolling average CTR by placement"
        
      - name: vcr_3month_avg
        data_type: float
        description: "90-day rolling average video completion rate by placement"
        
      - name: cpc_3month_avg
        data_type: float
        description: "90-day rolling average CPC by placement"
        
      - name: cpcv_3month_avg
        data_type: float
        description: "90-day rolling average CPCV by placement"
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [day, placement_name]

  - name: mart_monthly_campaign__level_report
    description: "Monthly aggregated campaign-level performance report"
    config:
      contract:
        enforced: true
    columns:
      - name: month
        data_type: date
        description: "Report month"
        constraints:
          - type: not_null
          
      - name: campaign_id
        data_type: string
        description: "Campaign identifier"
        tests:
          - not_null
          
      - name: campaign_name
        data_type: string
        description: "Campaign name"
        
      - name: site_name
        data_type: string
        description: "Site or publisher name"
        
      - name: creative_concept
        data_type: string
        description: "Creative concept identifier"
        
      - name: creative_type
        data_type: string
        description: "Type of creative"
        tests:
          - accepted_values:
              arguments:
                values: ['video', 'display', 'native', 'audio']
        
      - name: state
        data_type: string
        description: "Geographic state"
        
      - name: region
        data_type: string
        description: "Geographic region"
        
      - name: sex
        data_type: string
        description: "Target gender demographic"
        tests:
          - accepted_values:
              arguments:
                values: ['Male', 'Female', 'Unknown', 'All']
        
      - name: device_type
        data_type: string
        description: "Device type"
        tests:
          - accepted_values:
              arguments:
                values: ['mobile', 'desktop', 'tablet', 'ctv']
        
      - name: impressions
        data_type: number
        description: "Total impressions for the month"
        constraints:
          - type: not_null
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: clicks
        data_type: number
        description: "Total clicks for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: ias_video_completions
        data_type: number
        description: "Total video completions for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: media_cost
        data_type: float
        description: "Total media cost for the month"
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: ctr
        data_type: float
        description: "Average CTR for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
        
      - name: vcr
        data_type: float
        description: "Average video completion rate for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "between 0 and 1"
        
      - name: cpc
        data_type: float
        description: "Average CPC for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: cpcv
        data_type: float
        description: "Average CPCV for the month"
        tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"
        
      - name: ctr_3month_avg
        data_type: float
        description: "Average of 90-day rolling CTR"
        
      - name: vcr_3month_avg
        data_type: float
        description: "Average of 90-day rolling VCR"
        
      - name: cpc_3month_avg
        data_type: float
        description: "Average of 90-day rolling CPC"
        
      - name: cpcv_3month_avg
        data_type: float
        description: "Average of 90-day rolling CPCV"
    
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, campaign_id]