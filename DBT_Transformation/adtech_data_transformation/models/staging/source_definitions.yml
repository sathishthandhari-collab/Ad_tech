version: 2

sources:
  - name: cm360
    database: adtech_analytics_dev
    schema: raw
    tables:
      - name: cm360_raw_data
        description: "Raw CM360 campaign data"
        columns:
          - name: day
          - name: campaign_name
          - name: campaign_id
          - name: site_name
          - name: placement_name
            tests:
              - not_null
          - name: creative_type
          - name: impressions
          - name: clicks

  - name: ias
    database: adtech_analytics_dev
    schema: raw
    tables:
      - name: ias_raw_data
        description: "Raw IAS verification data"
        columns:
          - name: date
          - name: publisher
          - name: campaign
          - name: campaignId
          - name: placement
            tests:
              - not_null
          - name: ad_format
          - name: monitored_ads
          - name: viewable_ads
          - name: brand_safety_ads
          - name: out_of_geo_ads
          - name: clk
          - name: views
          - name: video_completions
  - name: sites
    database: adtech_analytics_dev
    schema: raw
    tables:
      - name: CM360_STAGE_DATA_VIEW

      - name: IAS_STAGE_DATA_VIEW

      - name: AMAZON_RAW_DATA

      - name: AVZU_RAW_DATA

      - name: BINGADS_RAW_DATA

      - name: CM360_RAW_DATA

      - name: CRITEO_RAW_DATA

      - name: DV360_RAW_DATA

      - name: HINDHU_RAW_DATA

      - name: IAS_RAW_DATA

      - name: INMOBI_RAW_DATA

      - name: MAGNITE_RAW_DATA

      - name: MIQ_RAW_DATA

      - name: PUBMATIC_RAW_DATA

      - name: REMEZCLA_RAW_DATA

      - name: SHARETHROUGH_RAW_DATA

      - name: TOI_RAW_DATA

      - name: TTD_RAW_DATA

      - name: WEBMD_RAW_DATA

      - name: YOUTUBE_RAW_DATA

