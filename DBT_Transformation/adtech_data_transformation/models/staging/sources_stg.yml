version: 2

sources:
  - name: cm360
    database: adtech_analytics_dev
    schema: raw
    tables:
      - name: cm360_raw_data
        description: "Raw CM360 campaign data"
        columns:
          - name: day
          - name: campaign_name
          - name: campaign_id
          - name: site_name
          - name: placement_name
            tests:
              - not_null
          - name: creative_type
          - name: impressions
          - name: clicks

  - name: ias
    database: adtech_analytics_dev
    schema: raw
    tables:
      - name: ias_raw_data
        description: "Raw IAS verification data"
        columns:
          - name: date
          - name: publisher
          - name: campaign
          - name: campaignId
          - name: placement
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('cm360', 'cm360_raw_data')
                    field: placement_name
          - name: ad_format
          - name: monitored_ads
          - name: viewable_ads
          - name: brand_safety_ads
          - name: out_of_geo_ads
          - name: clk
          - name: views
          - name: video_completions
  - name: sites
    database: adtech_analytics
    schema: raw
    tables:
      - name: cm360_stage_data_view
      - name: ias_stage_data_view
      - name: amazon_raw_data
      - name: avzu_raw_data
      - name: bingads_raw_data
      - name: cm360_raw_data
      - name: criteo_raw_data
      - name: dv360_raw_data
      - name: hindhu_raw_data
      - name: ias_raw_data
      - name: inmobi_raw_data
      - name: magnite_raw_data
      - name: miq_raw_data
      - name: pubmatic_raw_data
      - name: remezcla_raw_data
      - name: sharethrough_raw_data
      - name: toi_raw_data
      - name: ttd_raw_data
      - name: webmd_raw_data
      - name: youtube_raw_data
