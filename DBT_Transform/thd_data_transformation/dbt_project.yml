name: thd_data_transformation

profile: thd_data_transformation

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  thd_data_transformation:
    +schema: staging

models:
  thd_data_transformation:
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral 
    marts:
      +materialized: table


  dbt-cloud:
    project-id: 70471823504854

